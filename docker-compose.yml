version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: looma-rabbitmq
    ports:
      - "5672:5672"     # conexão da aplicação
      - "15672:15672"   # painel web
    environment:
      RABBITMQ_DEFAULT_USER: looma
      RABBITMQ_DEFAULT_PASS: looma
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
